# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'makespace-app'
primary_region = 'lhr'

[build]

[deploy]
strategy = "immediate"

[env]
BACKGROUND_PROCESSING_ENABLED = 'true'
SMTP_PORT = '587'
PUBLIC_URL = 'https://app.makespace.org'
SMTP_HOST = 'in-v3.mailjet.com'
SMTP_FROM = 'it-maintainers@makespace.org'
LOG_LEVEL = 'debug'
RUST_BACKTRACE = 'full'
TROUBLE_TICKET_SHEET = '1P36QUdnEyIGlX_pMP-3FjWTFXOILKAYNYNAkl6N4nK4'
# Gmail import into /mailbox (see docs/gmail-import.md). management@ is a
# GROUP (no mailbox of its own), so we authenticate as tickets@ - a member
# account of that group, confirmed to receive its mail - and filter to mail
# addressed to the group, keeping the account's other traffic out. Until
# credentials are set the sync just logs an auth error each cycle.
GMAIL_IMPORT_MAILBOX = 'tickets@makespace.org'
GMAIL_FILTER_TO_ADDRESS = 'management@makespace.org'
# Owners of this area (the management team) may view /mailbox, alongside
# super-users.
MANAGEMENT_TEAM_AREA_ID = '838b00ec-d610-4bb3-a01b-5bc40613c197'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
grace_period = "5m"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/ping"

[[vm]]
size = 'performance-1x'

[mounts]
source = "google_db_data"
destination = "/google_db_data"
initial_size = "1GB"
processes = ['app']
