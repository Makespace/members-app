name: CI/CD

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  typecheck:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make typecheck

  lint:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make lint unused-exports

  # The budget covers the whole job, not just jest: checkout, mise and
  # `make node_modules` are all inside it. At two minutes the suite was
  # finishing with seconds to spare - 1m24s, 1m50s, 1m55s on recent runs of
  # main - and the same commit could pass one run and be killed on the next,
  # which reads as a broken branch rather than a slow one. Ten leaves room to
  # keep adding tests; if the suite ever genuinely needs that long, the fix is
  # the suite, not this number.
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make node_modules
      - run: npx jest

  audit:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make audit

  # Runs at 1m14s-1m25s, so it was heading the same way.
  smoketest:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make smoketest

  deploy:
    timeout-minutes: 15
    name: Deploy to fly.io
    if: github.ref == 'refs/heads/main'
    needs: [typecheck, lint, test, smoketest]
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
