name: Flag Recurly writes

# Labels and comments on any pull request that changes the Recurly write
# gateway (src/recurly-write/), starts using it, or touches the guards around
# it, so a maintainer always looks before it merges. It flags rather than
# blocks: the review is the control. See "Recurly writes" in AGENTS.md.
#
# pull_request_target so it can label pull requests from forks, and so it runs
# the copy of this file on main - a pull request cannot switch it off for
# itself. That is only safe because it reads the diff through the API and
# never checks out or runs the pull request's code. Keep it that way: do not
# add actions/checkout of the pull request's head here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  flag:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'recurly-write';
            const MARKER = '<!-- recurly-write-flag -->';
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });

            // Lines added or removed by the diff, without the +/- marker.
            const changedLines = patch =>
              (patch || '').split('\n')
                .filter(l => /^[+-]/.test(l) && !/^(\+\+\+|---)/.test(l))
                .map(l => l.slice(1));

            const usesGateway = /recurlyWrite|recurly-write|RECURLY_WRITE_TOKEN|['"]recurly(\/[^'"]*)?['"]|v3(\.eu)?\.recurly\.com/;
            const guardFiles = [
              'tests/recurly-write/',
              '.github/workflows/recurly-write-flag.yml',
            ];
            const docsAndConfig = ['AGENTS.md', 'CLAUDE.md', 'eslint.config.js', 'src/configuration.ts'];

            const reasons = [];
            for (const f of files) {
              const name = f.filename;
              const lines = changedLines(f.patch);
              if (name.startsWith('src/recurly-write/')) {
                reasons.push(`changes the write gateway itself: \`${name}\``);
              } else if (guardFiles.some(g => name.startsWith(g))) {
                reasons.push(`changes a guard around Recurly writes: \`${name}\``);
              } else if (docsAndConfig.includes(name) && /recurly/i.test(f.patch || '')) {
                // The whole hunk, context included: adding a file to the lint
                // rule's ignores list need not mention Recurly on the line itself.
                reasons.push(`changes Recurly rules or config: \`${name}\``);
              } else if (lines.some(l => usesGateway.test(l))) {
                reasons.push(`uses or refers to Recurly writes: \`${name}\``);
              } else if (f.patch === undefined && f.status !== 'removed' && /^(src|scripts)\//.test(name)) {
                // GitHub leaves out the diff of very large changes; err on the side of a look.
                reasons.push(`diff too large to inspect automatically: \`${name}\``);
              }
            }

            const {data: comments} = await github.rest.issues.listComments({
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            const labels = context.payload.pull_request.labels.map(l => l.name);

            if (reasons.length === 0) {
              if (labels.includes(LABEL)) {
                await github.rest.issues.removeLabel({owner, repo, issue_number: pull_number, name: LABEL});
              }
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: `${MARKER}\nThis pull request no longer touches Recurly writes.`,
                });
              }
              core.info('No Recurly write changes found.');
              return;
            }

            try {
              await github.rest.issues.getLabel({owner, repo, name: LABEL});
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'b60205',
                description: 'Touches code that can change subscriptions or money in Recurly',
              });
            }
            await github.rest.issues.addLabels({owner, repo, issue_number: pull_number, labels: [LABEL]});

            const body = [
              MARKER,
              '### ⚠️ This pull request touches Recurly writes',
              '',
              'Recurly holds members\' subscriptions and cards, so code here can end memberships or move money. A maintainer should review it carefully before merging.',
              '',
              '**Why it was flagged:**',
              ...reasons.map(r => `- ${r}`),
              '',
              '**Reviewer checklist** (see "Recurly writes" in AGENTS.md):',
              '- [ ] Every write goes through `deps.recurlyWrite`; nothing builds its own Recurly client or calls the Recurly API directly.',
              '- [ ] The caller checks the actor is allowed to change *this* subscription (e.g. that it is the member\'s own) before calling the gateway.',
              '- [ ] Each call passes a real actor and a meaningful reason.',
              '- [ ] Any new gateway operation is narrow (one specific action), not a pass-through to the raw client.',
              '- [ ] The guards (boundary test, lint rule, this workflow) were not weakened to make the change pass.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: pull_number, body});
            }
            await core.summary.addRaw(body).write();
            core.warning(`Recurly writes touched: ${reasons.length} reason(s) - see the pull request comment.`);
